<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Tesla Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  /* El juego es blanco y negro a propósito, igual en modo claro y oscuro */
  :root { --bg: #ffffff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #ffffff; } }
  :root[data-theme="dark"] { --bg: #ffffff; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
</style>
</head>
<body>
<canvas id="c" aria-label="Juego: Tesla saltando obstáculos"></canvas>
<script>
(() => {
  // ---------- Ajustes del juego ----------
  const VIEW_H = 300;          // alto lógico del mundo
  const MIN_VIEW_W = 600;      // ancho lógico mínimo visible
  const GROUND_Y = 235;        // línea del suelo
  const TESLA_X = 40;
  const TESLA_W = 130;
  const LEVITATE = 6;          // el Tesla flota un poquito
  const OBS_H = 56;
  const GRAVITY = 1700;
  const JUMP_V = 640;          // ~0.75 s en el aire
  const START_SPEED = 380, MAX_SPEED = 820, ACCEL = 9;
  const CRASH_PAUSE = 500;     // ms de pausa al chocar

  // ---------- Recursos ----------
  const load = src => { const i = new Image(); i.src = src; return i; };
  const img = {
    tesla: load('img/tesla.png'),
    crash: load('img/tesla_perdio.png'),
    obs: [load('img/obs1.png'), load('img/obs2.png'), load('img/obs3.png')],
    final: load('img/final.png'),
    start: load('img/principio.png'),
    ground: load('img/suelo.png'),
  };
  const music = new Audio('musica.mp3');
  music.loop = true;
  music.preload = 'auto';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let scale = 1, viewW = MIN_VIEW_W, offY = 0, dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    const cw = window.innerWidth, ch = window.innerHeight;
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
    const minW = ch > cw ? 500 : MIN_VIEW_W;   // en celular vertical se ve más grande
    scale = Math.min(cw / minW, ch / VIEW_H, 2.2);
    viewW = cw / scale;
    offY = (ch / scale - VIEW_H) / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Estado ----------
  const teslaH = () => TESLA_W * (img.tesla.naturalHeight || 116) / (img.tesla.naturalWidth || 400);
  let state = 'ready';         // ready | playing | crash | over
  let y = 0, vy = 0;           // altura sobre el suelo (positiva hacia arriba)
  let speed = START_SPEED, groundX = 0, obstacles = [], nextGap = 0, distSinceSpawn = 0;
  let score = 0, best = 0, crashAt = 0, overAt = 0;
  try { best = +localStorage.getItem('tesla-best') || 0; } catch (e) {}

  function reset() {
    y = 0; vy = 0; speed = START_SPEED; obstacles = []; score = 0;
    distSinceSpawn = 0;
    nextGap = START_SPEED * 1.2;   // respiro antes del primer obstáculo
  }

  function startGame() {
    reset();
    state = 'playing';
    try { music.currentTime = 0; } catch (e) {}
    music.play().catch(() => {});
    jump();
  }

  function jump() {
    if (state === 'playing' && y <= 0.5) vy = JUMP_V;
  }

  function action() {
    if (state === 'ready') startGame();
    else if (state === 'playing') jump();
    else if (state === 'over' && performance.now() - overAt > 350) startGame();
  }

  window.addEventListener('keydown', e => {
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code) || e.key === ' ') {
      e.preventDefault();
      if (!e.repeat || state === 'playing') action();
    }
  });
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); action(); });

  // ---------- Obstáculos ----------
  function spawn() {
    const k = Math.floor(Math.random() * 3);
    const im = img.obs[k];
    const w = OBS_H * (im.naturalWidth || 250) / (im.naturalHeight || 240);
    obstacles.push({ x: viewW + 20, w, h: OBS_H, im });
    distSinceSpawn = -w;
    // Separación amplia: tiempo de reacción + largo del Tesla
    const airDist = speed * (2 * JUMP_V / GRAVITY);
    nextGap = airDist + TESLA_W + speed * (0.35 + Math.random() * 0.9);
  }

  function hit(o) {
    const th = teslaH();
    const tTop = GROUND_Y - LEVITATE - y - th;
    const t = { l: TESLA_X + 10, r: TESLA_X + TESLA_W - 8, t: tTop + th * 0.2, b: tTop + th - 3 };
    const ob = { l: o.x + o.w * 0.18, r: o.x + o.w * 0.82, t: GROUND_Y - o.h * 0.85, b: GROUND_Y };
    return t.l < ob.r && t.r > ob.l && t.t < ob.b && t.b > ob.t;
  }

  // ---------- Bucle ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt, now);
    draw(now);
    requestAnimationFrame(loop);
  }

  function update(dt, now) {
    if (state === 'playing') {
      speed = Math.min(MAX_SPEED, speed + ACCEL * dt);
      groundX = (groundX + speed * dt) % 100000;
      score += speed * dt / 40;

      vy -= GRAVITY * dt;
      y += vy * dt;
      if (y < 0) { y = 0; vy = 0; }

      for (const o of obstacles) o.x -= speed * dt;
      obstacles = obstacles.filter(o => o.x + o.w > -20);
      distSinceSpawn += speed * dt;
      if (distSinceSpawn >= nextGap) spawn();

      if (obstacles.some(hit)) {
        state = 'crash';
        crashAt = now;
        music.pause();
        if (score > best) { best = Math.floor(score); try { localStorage.setItem('tesla-best', best); } catch (e) {} }
      }
    } else if (state === 'crash' && now - crashAt >= CRASH_PAUSE) {
      state = 'over';
      overAt = now;
    }
  }

  function drawGround() {
    const g = img.ground;
    if (!g.complete || !g.naturalWidth) {
      ctx.fillStyle = '#535353'; ctx.fillRect(0, GROUND_Y, viewW, 2); return;
    }
    const k = 0.5, tw = g.naturalWidth * k, th = g.naturalHeight * k;
    const top = GROUND_Y - 24 * k;
    if (state === 'ready') {
      // Suelo corto como en la pantalla de inicio
      ctx.drawImage(g, 0, 0, 320, g.naturalHeight, 20, top, 320 * k * 1.1, th);
      return;
    }
    let x = -(groundX % tw);
    for (; x < viewW; x += tw) ctx.drawImage(g, x, top, tw + 1, th);
  }

  function drawTesla() {
    const th = teslaH();
    const top = GROUND_Y - LEVITATE - y - th;
    const bob = state === 'playing' && y === 0 ? Math.sin(performance.now() / 120) * 1.2 : 0;
    if (state === 'crash' || state === 'over') {
      const c = img.crash;
      ctx.drawImage(c, TESLA_X, top - th * (80 / 217), TESLA_W, th * (378 / 217));
    } else {
      // sombra suave para que se note que levita
      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      ctx.beginPath();
      ctx.ellipse(TESLA_X + TESLA_W / 2, GROUND_Y - 1, TESLA_W * 0.38 * (1 - Math.min(y, 100) / 200), 2.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.drawImage(img.tesla, TESLA_X, top + bob, TESLA_W, th);
    }
  }

  function drawScore() {
    ctx.fillStyle = '#535353';
    ctx.font = '10px "Press Start 2P", monospace';
    ctx.textAlign = 'right';
    const pad = n => String(Math.floor(n)).padStart(5, '0');
    ctx.fillText((best ? 'HI ' + pad(best) + '  ' : '') + pad(score), viewW - 16, 30);
  }

  function draw(now) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, offY * scale * dpr);
    ctx.imageSmoothingEnabled = true;

    drawGround();
    for (const o of obstacles) ctx.drawImage(o.im, o.x, GROUND_Y - o.h + 2, o.w, o.h);
    drawTesla();

    if (state === 'ready') {
      const s = img.start;
      if (s.naturalWidth) {
        const w = Math.min(380, viewW - 40), h = w * s.naturalHeight / s.naturalWidth;
        ctx.drawImage(s, 20, GROUND_Y + 30, w, h);
      }
    } else {
      drawScore();
    }

    if (state === 'over') {
      const f = img.final;
      if (f.naturalWidth) {
        const h = 210, w = h * f.naturalWidth / f.naturalHeight;
        const x = Math.max(TESLA_X + TESLA_W + 10, Math.min(viewW / 2 - w / 2, viewW - w - 10));
        ctx.drawImage(f, x, GROUND_Y - h + 14, w, h);
      }
      if (Math.floor(now / 600) % 2 === 0) {
        ctx.fillStyle = '#535353';
        ctx.font = '8px "Press Start 2P", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('TOCA O ESPACIO PA\' VOLVER', viewW / 2, GROUND_Y + 45);
      }
    }
  }

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
